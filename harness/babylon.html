<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>babylon.js harness</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060a; }
  canvas { display:block; }
  #hud { position:fixed; top:8px; left:8px; color:#0ff; font:12px monospace; z-index:10; white-space:pre; }
</style>
<script src="/vendor/babylonjs/babylon.js"></script>
<script src="/vendor/babylonjs-loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
<div id="hud">babylon booting…</div>
<canvas id="c"></canvas>
<script type="module">
import '/harness/common/probe.js';
import { createHarness, createGpuTimer, inspectActiveSamplers, readParams, detectGpu, runLoop, CONTRACT, measureFramebufferCoverage } from '/harness/common/runtime.js';
import { cameraAt } from '/spec/contract.js';
import { buildGridForTotalTriangles, buildObjectLayout, buildLightLayout, buildOverdrawLayout, OVERDRAW_PBR_TEXTURES, OVERDRAW_ALPHA, buildQuad, buildBox, buildUvSphere, buildShadowLayout, buildShadowLightLayout, shadowCasterLayoutSignature, shadowLightLayoutSignature, buildVisibilityLayout, buildRaycastLayout, buildPhysicsLayout } from '/spec/scene-spec.js';

const params = readParams();
const { state, info } = createHarness('babylon');
info.engineVersion = BABYLON.Engine.Version;
info.gpu = detectGpu();
info.requested = { ...params };
const hud = document.getElementById('hud');

const canvas = document.getElementById('c');
canvas.width = CONTRACT.viewport.w; canvas.height = CONTRACT.viewport.h;
canvas.style.width = CONTRACT.viewport.w + 'px';
canvas.style.height = CONTRACT.viewport.h + 'px';

// ---- Engine initialization ----
const engine = new BABYLON.Engine(canvas, CONTRACT.antialias);
info.gpu = detectGpu(engine._gl);
info.actual.antialiasEnabled = engine._gl.getContextAttributes().antialias;
engine.setHardwareScalingLevel(1 / CONTRACT.devicePixelRatio);
const gpuTimer = (params.coverage > 0 || params.shadowCasters > 0)
  ? createGpuTimer(engine._gl) : null;

const scene = new BABYLON.Scene(engine);
// Align coordinate handedness so the shared layout is not mirrored.
scene.useRightHandedSystem = true;
const cc = CONTRACT.clearColor;
scene.clearColor = new BABYLON.Color4(cc.r, cc.g, cc.b, cc.a);

const camera = new BABYLON.UniversalCamera('cam', new BABYLON.Vector3(0, 0, 0), scene);
camera.fov = CONTRACT.camera.fov * Math.PI / 180;
camera.minZ = CONTRACT.camera.near;
camera.maxZ = CONTRACT.camera.far;
scene.activeCamera = camera;

info.renderWidth = engine.getRenderWidth(true);
info.renderHeight = engine.getRenderHeight(true);

// ---- Shared directional light ----
let baseLight = null;
{
  const A = CONTRACT.baseLight;
  const intensity = params.coverage > 0 ? A.pbrPixelIntensity
    : (params.shadowCasters > 0 ? A.shadowFillIntensity : A.intensity);
  const base = new BABYLON.DirectionalLight('baseLight',
    new BABYLON.Vector3(A.direction.x, A.direction.y, A.direction.z), scene);
  base.intensity = intensity;
  base.diffuse = new BABYLON.Color3(A.color.r, A.color.g, A.color.b);
  baseLight = base;
  info.actual.baseLight = 'DirectionalLight intensity=' + intensity;
}

// ---- Lights ----
const lights = [];
for (const L of buildLightLayout(params.lights)) {
  const light = new BABYLON.PointLight('pl' + L.i, new BABYLON.Vector3(L.x, L.y, L.z), scene);
  light.range = L.range;
  light.diffuse = new BABYLON.Color3(L.r, L.g, L.b);
  light.intensity = L.intensity;
  light._layout = L;
  lights.push(light);
}

// ---- Objects ----
// Leave maxSimultaneousLights at Babylon's default.
const objects = [];
const objectCount = params.objects;
if (objectCount > 0) {
  // Flip winding for Babylon's right-handed front-face convention.
  const grid = buildGridForTotalTriangles(params.triangles, objectCount, true);
  const mat = new BABYLON.PBRMaterial('mat', scene);
  mat.albedoColor = new BABYLON.Color3(0.69, 0.74, 0.78);
  mat.metallic = 0; mat.roughness = 1;
  const layout = buildObjectLayout(objectCount);

  let source = null;
  for (const it of layout) {
    let mesh;
    if (!source) {
      source = new BABYLON.Mesh('obj0', scene);
      const vd = new BABYLON.VertexData();
      vd.positions = grid.positions; vd.normals = grid.normals;
      vd.uvs = grid.uvs; vd.indices = grid.indices;
      vd.applyToMesh(source);
      source.material = mat;
      mesh = source;
    } else {
      // Mesh clones share Geometry but remain independent draw submissions.
      mesh = source.clone('obj' + it.i, null, true);
    }
    mesh.position = new BABYLON.Vector3(it.x, it.y, it.z);
    mesh.rotation = new BABYLON.Vector3(0, it.rotationY, 0);
    mesh.scaling = new BABYLON.Vector3(it.scale, it.scale, it.scale);
    mesh._layout = it;
    if (params.caseId === 'drawcalls') mesh.alwaysSelectAsActiveMesh = true;
    objects.push(mesh);
  }
  info.actual.triangleCountPerMesh = grid.triangleCount;
  info.actual.gridSegments = `${grid.segX}x${grid.segY}`;
  info.actual.geometrySharing = 'shared-single-geometry';
  info.actual.uniqueGeometryResources = new Set(objects.map(mesh => mesh.geometry)).size;
  info.actual.totalTriangles = grid.triangleCount * objectCount;
  info.actual.vertexCountPerMesh = grid.vertexCount;
  // Record the default without changing it.
  info.defaults.maxSimultaneousLights = mat.maxSimultaneousLights;
  if (params.caseId === 'lights-forward') {
    mat.maxSimultaneousLights = params.lights + 1;
    info.defaults.maxSimultaneousLights = mat.maxSimultaneousLights;
  }
}

const createBoxSource = (name, material) => {
  const box = buildBox(true);
  const src = new BABYLON.Mesh(name, scene);
  const vd = new BABYLON.VertexData();
  vd.positions = box.positions; vd.normals = box.normals;
  vd.uvs = box.uvs; vd.indices = box.indices;
  vd.applyToMesh(src);
  src.material = material;
  return { box, src };
};

const createShadowCasterSource = (name, material) => {
  const S = CONTRACT.shadow;
  const caster = buildUvSphere(S.casterWidthSegments, S.casterHeightSegments, true);
  const src = new BABYLON.Mesh(name, scene);
  const vd = new BABYLON.VertexData();
  vd.positions = caster.positions; vd.normals = caster.normals;
  vd.uvs = caster.uvs; vd.indices = caster.indices;
  vd.applyToMesh(src);
  src.material = material;
  return { caster, src };
};

// ---- Instanced dynamic spotlight shadows ----
let shadowLayout = null;
let shadowSource = null;
let shadowInstanceData = null;
const shadowLights = [];
const shadowGenerators = [];
const shadowMatrix = new BABYLON.Matrix();
const shadowQuat = new BABYLON.Quaternion();
const shadowPosition = new BABYLON.Vector3();
const shadowScale = new BABYLON.Vector3();
const shadowAxisY = BABYLON.Axis.Y;

function updateShadowInstances(t) {
  if (!shadowSource || !shadowLayout || !shadowInstanceData) return;
  shadowLayout.items.forEach((item, i) => {
    shadowPosition.set(
      item.x,
      item.y + Math.sin(t * 0.002 + item.phase) * 0.25,
      item.z);
    BABYLON.Quaternion.RotationAxisToRef(shadowAxisY, item.rotationY + t * 0.0008, shadowQuat);
    shadowScale.setAll(item.scale);
    BABYLON.Matrix.ComposeToRef(shadowScale, shadowQuat, shadowPosition, shadowMatrix);
    shadowMatrix.copyToArray(shadowInstanceData, i * 16);
  });
  shadowSource.thinInstanceBufferUpdated('matrix');
}

if (params.shadowCasters > 0) {
  const S = CONTRACT.shadow;
  const mat = new BABYLON.PBRMaterial('shadowMat', scene);
  mat.albedoColor = new BABYLON.Color3(0.77, 0.54, 0.35);
  mat.metallic = 0; mat.roughness = 1;
  const { caster, src } = createShadowCasterSource('shadow0', mat);
  shadowLayout = buildShadowLayout(params.shadowCasters);
  shadowSource = src;
  shadowInstanceData = new Float32Array(shadowLayout.items.length * 16);
  mat.maxSimultaneousLights = params.shadowLights + 1;
  src.receiveShadows = true;
  src.alwaysSelectAsActiveMesh = true;
  src.thinInstanceSetBuffer('matrix', shadowInstanceData, 16, false);
  updateShadowInstances(0);
  src.thinInstanceRefreshBoundingInfo(true);

  const shadowLightLayout = buildShadowLightLayout(params.shadowLights, {
    radius: S.lightRadius, height: S.lightHeight, targetHeight: S.targetHeight,
  });
  for (const L of shadowLightLayout) {
    const light = new BABYLON.SpotLight(
      'shadowLight' + L.i,
      new BABYLON.Vector3(L.x, L.y, L.z),
      new BABYLON.Vector3(L.dx, L.dy, L.dz),
      S.coneHalfAngleDeg * 2 * Math.PI / 180,
      0,
      scene);
    light.innerAngle = S.coneHalfAngleDeg * 2 * Math.PI / 180;
    light.falloffType = BABYLON.Light.FALLOFF_GLTF;
    light.range = S.far;
    light.intensity = S.intensity;
    light.shadowMinZ = S.near;
    light.shadowMaxZ = S.far;
    const generator = new BABYLON.ShadowGenerator(params.shadowMapSize, light);
    generator.bias = 0;
    generator.normalBias = 0;
    generator.usePoissonSampling = false;
    generator.usePercentageCloserFiltering = false;
    generator.useContactHardeningShadow = false;
    generator.addShadowCaster(src, false);
    shadowLights.push(light);
    shadowGenerators.push(generator);
  }
  const ground = BABYLON.MeshBuilder.CreateBox(
    'shadowGround', { width: shadowLayout.groundSize, height: 1, depth: shadowLayout.groundSize }, scene);
  ground.position.y = -0.5;
  const groundMat = new BABYLON.PBRMaterial('shadowGroundMat', scene);
  groundMat.albedoColor = new BABYLON.Color3(0.19, 0.21, 0.24);
  groundMat.metallic = 0; groundMat.roughness = 1;
  groundMat.maxSimultaneousLights = params.shadowLights + 1;
  ground.material = groundMat;
  ground.receiveShadows = true;

  info.actual.shadowCasters = shadowLayout.items.length;
  info.actual.shadowLights = shadowLights.length;
  info.actual.shadowMaps = shadowGenerators.length;
  info.actual.shadowMapSize = params.shadowMapSize;
  info.actual.shadowType = 'hard-single-sample';
  info.actual.engineShadowType = 'BABYLON.ShadowGenerator basic';
  info.actual.shadowMapStorage = 'independent-2d-per-light';
  info.actual.shadowCasterLayoutSignature = shadowCasterLayoutSignature(shadowLayout);
  info.actual.shadowLightLayoutSignature = shadowLightLayoutSignature(shadowLightLayout);
  info.actual.shadowProjectionSignature =
    `${S.near}|${S.far}|${S.coneHalfAngleDeg}|${S.intensity}|inverse-square`;
  info.actual.shadowCasterGeometry =
    `uv-sphere:${S.casterWidthSegments}x${S.casterHeightSegments}`;
  info.actual.shadowTrianglesPerCaster = caster.triangleCount;
  info.actual.shadowInstanced = true;
  info.actual.expectedShadowDrawCalls = shadowLights.length + 2;
  info.actual.expectedShadowTriangles =
    caster.triangleCount * shadowLayout.items.length * (shadowLights.length + 1) + 12;
  info.actual.totalTriangles = caster.triangleCount * shadowLayout.items.length;
  info.actual.vertexCountPerMesh = caster.vertexCount;
}

// ---- Default frustum culling ----
const visibilityObjects = [];
if (params.visibilityObjects > 0) {
  const mat = new BABYLON.PBRMaterial('visibilityMat', scene);
  mat.albedoColor = new BABYLON.Color3(0.44, 0.65, 0.78);
  mat.metallic = 0; mat.roughness = 1;
  const { box, src } = createBoxSource('visibility0', mat);
  const layout = buildVisibilityLayout(params.visibilityObjects, { visibleCount: params.visibleCount });
  for (const it of layout.items) {
    const mesh = it.i === 0 ? src : src.clone('visibility' + it.i, null, true);
    mesh.position.set(it.x, it.y, it.z);
    mesh.scaling.setAll(it.scale);
    visibilityObjects.push(mesh);
  }
  info.actual.visibilityObjects = visibilityObjects.length;
  info.actual.expectedVisibleObjects = layout.visibleCount;
  info.actual.visibleFraction = layout.visibleFraction;
  info.actual.cullingPolicy = 'standard bounding-info frustum culling(default)';
  info.actual.totalTriangles = box.triangleCount * visibilityObjects.length;
  info.actual.vertexCountPerMesh = box.vertexCount;
}

// ---- CPU AABB ray queries ----
let raycastHits = 0;
let raycastExpectedHits = 0;
const raycastBoxes = [];
const raycastRays = [];
if (params.raycastTargets > 0 && params.raycasts > 0) {
  const layout = buildRaycastLayout(params.raycastTargets, params.raycasts);
  for (const t of layout.targets) {
    raycastBoxes.push({
      min: new BABYLON.Vector3(t.x - t.hx, t.y - t.hy, t.z - t.hz),
      max: new BABYLON.Vector3(t.x + t.hx, t.y + t.hy, t.z + t.hz),
    });
  }
  for (const r of layout.rays) {
    raycastRays.push(new BABYLON.Ray(
      new BABYLON.Vector3(r.ox, r.oy, r.oz),
      new BABYLON.Vector3(r.dx, r.dy, r.dz),
      100));
  }
  raycastExpectedHits = layout.expectedHits;
  info.actual.raycastTargets = layout.targetCount;
  info.actual.raycasts = layout.rayCount;
  info.actual.raycastExpectedHits = layout.expectedHits;
  info.actual.raycastPolicy = 'linear BABYLON.Ray.intersectsBoxMinMax';
}

// ---- Physics: Havok ----
const physBodies = [];
let havokEnabled = false;
let havokPlugin = null;
const PHYS_DT = 1 / 60;
let physicsSteps = 0;
let physRenderSource = null;
let physRenderData = null;
const physRenderMatrix = new BABYLON.Matrix();
const physRenderIdentityScale = new BABYLON.Vector3(1, 1, 1);
const physRenderIdentityRotation = BABYLON.Quaternion.Identity();
if (params.bodies > 0) {
  const HK = await import('/vendor/@babylonjs/havok/lib/esm/HavokPhysics_es.js');
  const havok = await HK.default({
    locateFile: () => '/vendor/@babylonjs/havok/lib/esm/HavokPhysics.wasm',
  });
  // The render-only baseline does not initialize Havok.
  if (params.animate) {
    havokPlugin = new BABYLON.HavokPlugin(true, havok);
    scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), havokPlugin);
    havokEnabled = true;
  }

  const L = buildPhysicsLayout(params.bodies);
  const gSize = L.groundSize;
  const ground = BABYLON.MeshBuilder.CreateBox('pground', { width: gSize, height: 1, depth: gSize }, scene);
  ground.position.y = -0.5;
  const gm = new BABYLON.PBRMaterial('pgm', scene);
  gm.albedoColor = new BABYLON.Color3(0.10, 0.11, 0.14);
  gm.metallic = 0; gm.roughness = 1;
  ground.material = gm;
  if (havokEnabled) new BABYLON.PhysicsAggregate(ground, BABYLON.PhysicsShapeType.BOX, { mass: 0 }, scene);

  // Share geometry and material across instances.
  const src = BABYLON.MeshBuilder.CreateBox('pbox', { size: L.size }, scene);
  const bm = new BABYLON.PBRMaterial('pbm', scene);
  bm.albedoColor = new BABYLON.Color3(0.75, 0.50, 0.31);
  bm.metallic = 0; bm.roughness = 1;
  src.material = bm;
  src.isVisible = false;
  for (const it of L.items) {
    const m = it.i === 0 ? src : src.createInstance('pb' + it.i);
    m.isVisible = false;
    m.position = new BABYLON.Vector3(it.x, it.y, it.z);
    if (havokEnabled) {
      const agg = new BABYLON.PhysicsAggregate(m, BABYLON.PhysicsShapeType.BOX, { mass: it.mass }, scene);
      havokPlugin.setActivationControl(agg.body, BABYLON.PhysicsActivationControl.ALWAYS_ACTIVE);
      agg.body.setLinearVelocity(new BABYLON.Vector3(it.vx, 0, it.vz));
      physBodies.push({ aggregate: agg, node: m });
    } else {
      physBodies.push({ aggregate: null, node: m });
    }
  }
  physRenderSource = BABYLON.MeshBuilder.CreateBox('physicsRender', { size: L.size }, scene);
  physRenderSource.material = bm;
  physRenderSource.alwaysSelectAsActiveMesh = true;
  physRenderData = new Float32Array(L.items.length * 16);
  for (let i = 0; i < L.items.length; i++) {
    const node = physBodies[i].node;
    BABYLON.Matrix.ComposeToRef(
      physRenderIdentityScale,
      node.rotationQuaternion || physRenderIdentityRotation,
      node.position,
      physRenderMatrix);
    physRenderMatrix.copyToArray(physRenderData, i * 16);
  }
  physRenderSource.thinInstanceSetBuffer('matrix', physRenderData, 16, false);
  physRenderSource.thinInstanceRefreshBoundingInfo(true);
  // Disable automatic advancement; the benchmark performs one fixed step per rendered frame.
  if (havokEnabled) scene.physicsEnabled = false;
  info.actual.bodies = physBodies.length;
  info.actual.physicsEngine = 'Havok (@babylonjs/havok)';
  info.actual.physFixedStep = PHYS_DT;
  info.actual.physStepsPerFrame = 1;
  info.actual.physicsSleepingAllowed = false;
  info.actual.physicsInstanced = true;
  info.actual.expectedPhysicsDrawCalls = 2;
  info.actual.expectedPhysicsTriangles = L.items.length * 12 + 12;
  info.actual.totalTriangles = L.items.length * 12;
  info.actual.vertexCountPerMesh = 24;
}

// ---- Skeletal animation ----
// AssetContainer creates independent skeletons and retargeted animation groups.
const skinnedChars = [];
if (params.skinned > 0) {
  const container = await BABYLON.SceneLoader.LoadAssetContainerAsync('/assets/', params.model, scene);
  const srcGroup = container.animationGroups[0];
  const layout = buildObjectLayout(params.skinned, { scale: 1.0 });
  for (const it of layout) {
    // Share materials across character instances.
    const inst = container.instantiateModelsToScene((n) => `${n}_${it.i}`, false);
    const root = inst.rootNodes[0];
    root.position = new BABYLON.Vector3(it.x, 0, it.z);
    root.rotation = new BABYLON.Vector3(0, it.rotationY, 0);
    for (const mesh of root.getChildMeshes(false)) mesh.alwaysSelectAsActiveMesh = true;
    for (const g of inst.animationGroups) {
      // Offset animation phases across characters.
      g.goToFrame((it.i % 24) / 24 * (g.to - g.from) + g.from);
      // Explicitly stop the render-only baseline.
      if (params.animate) g.play(true); else g.stop();
    }
    skinnedChars.push(root);
  }
  info.actual.skinned = skinnedChars.length;
  info.actual.bonesPerChar = container.skeletons[0]?.bones.length ?? null;
  info.actual.animChannels = srcGroup?.targetedAnimations.length ?? null;
  info.actual.expectedSkinnedDrawCalls = skinnedChars.length;
  info.actual.expectedSkinnedTriangles = skinnedChars.length * 4672;
  info.actual.totalTriangles = info.actual.expectedSkinnedTriangles;
}

// ---- overdraw ----
// Full-screen transparent PBR layers isolate fragment and blending cost.
const overdrawQuads = [];
let overdrawRoot = null;
let overdrawMaterial = null;
if (params.coverage > 0) {
  const od = buildOverdrawLayout(params.coverage, { aspect: CONTRACT.viewport.w / CONTRACT.viewport.h, fovDeg: CONTRACT.camera.fov });
  // All engines load the same four 512x512 PBR textures.
  const T = OVERDRAW_PBR_TEXTURES;
  const mat = new BABYLON.PBRMaterial('odMat', scene);
  mat.albedoTexture = new BABYLON.Texture(T.albedo, scene);
  mat.bumpTexture = new BABYLON.Texture(T.normal, scene);
  // Keep Babylon's own texture semantics while aligning texture count and coverage.
  mat.metallicTexture = new BABYLON.Texture(T.metalness, scene);
  mat.microSurfaceTexture = new BABYLON.Texture(T.roughness, scene);
  mat.alpha = OVERDRAW_ALPHA;
  mat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
  overdrawMaterial = mat;
  mat.alphaMode = BABYLON.Engine.ALPHA_COMBINE;
  mat.disableDepthWrite = true;
  mat.backFaceCulling = true;
  // Hardware instancing keeps submission at one draw call.
  const q0 = buildQuad(true);
  const src = new BABYLON.Mesh('odSrc', scene);
  {
    const vd = new BABYLON.VertexData();
    vd.positions = q0.positions; vd.normals = q0.normals;
    vd.uvs = q0.uvs; vd.indices = q0.indices;
    vd.applyToMesh(src);
  }
  src.material = mat;
  overdrawRoot = new BABYLON.TransformNode('odRoot', scene);
  overdrawRoot.parent = camera;
  src.parent = overdrawRoot;
  src.alwaysSelectAsActiveMesh = true;
  od.items.forEach((q, i) => {
    // The source mesh is layer zero; the remaining layers are instances.
    const m = i === 0 ? src : src.createInstance('od' + q.i);
    if (m !== src) {
      m.parent = overdrawRoot;
      m.alwaysSelectAsActiveMesh = true;
    }
    m.position = new BABYLON.Vector3(q.x, q.y, q.z);
    m.scaling = new BABYLON.Vector3(q.sideW, q.sideH, 1);
    m._od = q;
    overdrawQuads.push(m);
  });
  info.actual.coverage = params.coverage;
  info.actual.overdrawLayers = od.layers;
  info.actual.overdrawQuads = od.quadCount;
  info.actual.overdrawExpectedBlends = od.expectedPixelBlends;
  info.actual.overdrawInstanced = true;
  info.actual.overdrawAlpha = OVERDRAW_ALPHA;
  info.actual.overdrawAlphaAnimated = false;
  info.actual.overdrawMaterial = `PBRMaterial (4 PBR maps, normal alpha, alpha=${OVERDRAW_ALPHA})`;
  info.actual.overdrawTextureInputs = 4;
  info.actual.totalTriangles = od.quadCount * 2;
  info.actual.vertexCountPerMesh = 4;
}

info.actual.objects = objects.length + (shadowLayout?.items.length ?? 0) + visibilityObjects.length;
info.actual.instances = objectCount + (shadowLayout?.items.length ?? 0) + visibilityObjects.length;
info.actual.lights = lights.length + shadowLights.length;
info.actual.lightPolicy = params.shadowCasters > 0
  ? `forward(maxSimultaneousLights=${params.shadowLights + 1})`
  : (params.caseId === 'lights-forward'
      ? `forward-all(maxSimultaneousLights=${params.lights + 1})`
      : `maxSimultaneousLights=${info.defaults.maxSimultaneousLights ?? 'n/a'}(default)`);
info.defaults.parallelShaderCompile = !!engine.getCaps().parallelShaderCompile;
info.defaults.useReverseDepthBuffer = engine.useReverseDepthBuffer;

// ---- Shader warmup ----
state.assetsLoaded = true;
info.timings.assetsLoadedMs = performance.now();
{
  const cameraPreset = params.bodies > 0 ? 'physics'
    : ((params.visibilityObjects > 0 || params.raycasts > 0) ? 'visibility' : null);
  const c0 = cameraAt(0, cameraPreset);
  camera.position.set(c0.x, c0.y, c0.z);
  camera.setTarget(new BABYLON.Vector3(c0.tx, c0.ty, c0.tz));
  // Keep rendering while asynchronous shader preparation settles.
  await new Promise((resolve) => {
    let settled = false;
    scene.whenReadyAsync().then(() => { settled = true; resolve(); });
    const pump = () => { if (settled) return; scene.render(); requestAnimationFrame(pump); };
    requestAnimationFrame(pump);
    // Prevent a single rung from hanging the batch.
    setTimeout(() => { if (!settled) { settled = true; info.shaderWaitTimedOut = true; resolve(); } }, 30000);
  });
  state.shaderReady = true;
  info.timings.shaderReadyMs = performance.now();
}

function engineTick(t, dt) {
  // Keep camera and light inputs fixed during the PBR pixel case.
  const sceneTime = params.coverage > 0 ? 0 : t;
  const cameraPreset = params.bodies > 0 ? 'physics'
    : ((params.visibilityObjects > 0 || params.raycasts > 0) ? 'visibility' : null);
  const c = cameraAt(sceneTime, cameraPreset);
  camera.position.set(c.x, c.y, c.z);
  camera.setTarget(new BABYLON.Vector3(c.tx, c.ty, c.tz));

  if (params.animate) {
    for (const o of objects) {
      const d = o._layout;
      if (!d) continue;
      o.rotation.y = d.rotationY + t * 0.0005;
      o.position.y = d.y + Math.sin(t * 0.002 + d.phase) * 0.6;
    }
    updateShadowInstances(t);
    if (params.coverage > 0 && overdrawQuads.length) {
      for (const m of overdrawQuads) {
        const q = m._od;
        m.position.x = q.x + Math.sin(t * q.motionSpeedX + q.motionPhaseX) * q.motionAmpX;
        m.position.y = q.y + Math.sin(t * q.motionSpeedY + q.motionPhaseY) * q.motionAmpY;
      }
    } else {
      for (const l of lights) {
        const d = l._layout;
        const ang = t * 0.0003 + d.phase;
        if (l.position) { l.position.x = Math.cos(ang) * d.orbit; l.position.z = Math.sin(ang) * d.orbit; }
      }
    }
    // Layers translate but do not rotate, preserving full-screen coverage.
    if (havokEnabled) {
      scene._advancePhysicsEngineStep(PHYS_DT * 1000);
      physicsSteps++;
      for (let i = 0; i < physBodies.length; i++) {
        const node = physBodies[i].node;
        BABYLON.Matrix.ComposeToRef(
          physRenderIdentityScale,
          node.rotationQuaternion || physRenderIdentityRotation,
          node.position,
          physRenderMatrix);
        physRenderMatrix.copyToArray(physRenderData, i * 16);
      }
      physRenderSource.thinInstanceBufferUpdated('matrix');
    }
  }
  if (raycastRays.length) {
    let hits = 0;
    for (const ray of raycastRays) {
      for (const box of raycastBoxes) if (ray.intersectsBoxMinMax(box.min, box.max)) hits++;
    }
    raycastHits = hits;
  }
  scene.render();
}

// Debug handles for manual inspection.
window.__SCENE_REFS__ = { BABYLON, scene, engine, camera, physBodies };

runLoop({
  state, info, params, engineTick, gpuTimer,
  onFinish() {
    if (shadowGenerators.length) {
      const maps = shadowGenerators.map(generator => generator.getShadowMap());
      const sizes = maps.map(map => map?.getSize?.().width).filter(Number.isFinite);
      info.actual.shadowMapSize = sizes[0] ?? null;
      info.actual.shadowMaps = new Set(maps.map(map => map?.renderTarget).filter(Boolean)).size || maps.length;
      info.actual.shadowNear = shadowLights[0].shadowMinZ;
    }
    info.framebufferCoverage = measureFramebufferCoverage(canvas, CONTRACT.clearColor);
    if (overdrawMaterial) info.actual.overdrawActiveSamplers = inspectActiveSamplers(engine._gl);
    if (overdrawMaterial) {
      const alpha = overdrawMaterial.alpha;
      const emissive = overdrawMaterial.emissiveColor.clone();
      overdrawMaterial.alpha = 1;
      overdrawMaterial.emissiveColor = BABYLON.Color3.White();
      scene.render();
      info.overdrawGeometryCoverage = measureFramebufferCoverage(canvas, CONTRACT.clearColor);
      overdrawMaterial.alpha = alpha;
      overdrawMaterial.emissiveColor = emissive;
      scene.render();
    }
    info.engineReported = {
      drawCalls: engine._drawCalls ? engine._drawCalls.current : null,
      activeMeshes: scene.getActiveMeshes().length,
      totalVertices: scene.getTotalVertices(),
      activeIndices: scene.getActiveIndices(),
    };
    if (physicsSteps) {
      info.actual.physSteps = physicsSteps;
      info.actual.physicsSleepingBodies = physBodies.reduce((count, entry) => {
        const bodyId = entry.aggregate?.body?._pluginData?.hpBodyId;
        if (bodyId == null) return count;
        const [, activationState] = havokPlugin._hknp.HP_Body_GetActivationState(bodyId);
        return count + (activationState.value === 0 ? 0 : 1);
      }, 0);
    }
    if (raycastRays.length) {
      info.actual.raycastHits = raycastHits;
      info.actual.raycastParity = raycastHits === raycastExpectedHits;
    }
    if (performance.memory) info.jsHeapMB = performance.memory.usedJSHeapSize / 1048576;
    hud.textContent = `babylon done  ${info.frame.frameCount}f p95=${info.frame.p95?.toFixed(1)}ms`
      + `\ndraw=${info.probe?.drawCalls} tri=${info.probe?.triangles}`;
  },
});
hud.textContent = `babylon  case=${params.caseId} obj=${info.actual.objects} L=${lights.length}`;
</script>
</body>
</html>
